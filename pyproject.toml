[project]
name = "pb-tokei"
version = "0.1.0"
description = "Statistics on pro doubles pickleball derived from broadcast footage"
authors = [
    { name = "Eloy Ye", email = "yeluo.eloy@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
pb-tokei = "pb_tokei:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "ty>=0.0.97",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ty.environment]
python-version = "3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
