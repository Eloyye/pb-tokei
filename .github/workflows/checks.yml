name: checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff format --check
      - run: uv run ruff check
      - run: uv run ty check
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
        working-directory: .
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: web/.bun-version
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run fmt:check
      - run: bun run test
      - name: Verify checkout update builds once
        working-directory: .
        shell: bash
        run: |
          uv run pb-tokei dev update
          uv run python -m pb_tokei.annotate.frontend check
          second_update=$(uv run pb-tokei dev update)
          printf '%s\n' "$second_update"
          if [[ "$second_update" != *"front end:   up to date, skipped build"* ]]; then
            echo "Expected the second checkout update to skip the build." >&2
            exit 1
          fi
      - name: API types match the FastAPI schema
        run: |
          bun run gen:api
          git diff --exit-code -- src/api/schema.d.ts || {
            echo "web/src/api/schema.d.ts is out of date: run 'bun run gen:api' in web/" >&2
            exit 1
          }
