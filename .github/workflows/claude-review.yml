name: claude-review

# Claude reviews each PR for security, correctness, maintainability and tests.
# The orchestrator (--model below) fans out to the reviewer subagents in
# .claude/agents/, verifies what they report, and posts the results.
#
# Auth: CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`) bills runs to the
# Claude subscription's usage limits, not API credits.

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

# A newer run for the same PR cancels the one in progress.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip drafts, and fork PRs (they cannot read the token secret).
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            BASE: ${{ github.event.pull_request.base.sha }}
            HEAD: ${{ github.event.pull_request.head.sha }}

            You are the orchestrator of a code review of this pull request.

            1. Read the PR title, body and diff (`gh pr view`, `gh pr diff`).
               Skim GLOSSARY.md and any ADRs in docs/adr/ the diff touches.
            2. In parallel, dispatch these four subagents with the Task tool,
               giving each the PR number and the list of changed files:
               security-reviewer, correctness-reviewer,
               maintainability-reviewer, test-reviewer.
            3. When they return, merge their findings: drop duplicates, and
               drop anything you cannot confirm by reading the code yourself.
               Do not report style issues that ruff already enforces.
            4. Post each confirmed finding as an inline comment on the exact
               line with mcp__github_inline_comment__create_inline_comment.
               Start each comment with the dimension in brackets, e.g.
               "[security]", and say concretely what goes wrong and how to fix it.
            5. Post one summary comment with `gh pr comment`: a one-line
               verdict, then a short section per dimension (write "No issues
               found" where that is true). Keep it brief.
          claude_args: |
            --model claude-opus-5-5
            --allowedTools "Task,Read,Grep,Glob,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(git diff:*),Bash(git log:*),mcp__github_inline_comment__create_inline_comment"
